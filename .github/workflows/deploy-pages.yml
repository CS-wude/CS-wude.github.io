name: Deploy portfolio with GitHub updates

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate GitHub Issues snapshot
        run: node .github/scripts/sync-issues.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.ISSUES_READ_TOKEN || github.token }}
          UPDATES_OWNER: CS-wude
          UPDATES_REPO: javaweb
          UPDATES_AUTHOR: CS-wude

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify blog
        run: npm run test:blog

      - name: Prepare blog artifact
        run: npm run build:blog

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

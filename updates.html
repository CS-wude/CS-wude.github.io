<html lang="zh-CN">
  <head>

    <link rel="stylesheet" href="./styles.css" />

  </head>
  <body id="top" data-page="updates">
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="返回首页">
        <span class="brand-mark">W</span>
        <span>WUDE</span>
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-label="打开菜单"
        aria-controls="mainNav"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav" id="mainNav" aria-label="主导航">
        <a href="./index.html">首页</a>
        <a href="./projects.html">项目</a>
        <a href="./notes.html">手记</a>
        <a class="is-current" href="./updates.html" aria-current="page">动态</a>
        <a href="./about.html">关于</a>
      </nav>
    </header>

    <main class="updates-page" id="mainContent">
      <section class="updates-masthead" aria-labelledby="updatesTitle">
        <div class="updates-masthead__meta">
          <p class="section-label">Workbench log / ongoing</p>
          <a
            class="updates-repo-link"
            href="https://github.com/CS-wude/javaweb/issues"
            target="_blank"
            rel="noreferrer"
          >原始记录 ↗</a>
        </div>

        <div class="updates-masthead__layout">
          <h1 id="updatesTitle">动态</h1>
          <div class="updates-masthead__copy">
            <p>有些东西还不值得写成长文：一次排查、一个刚想明白的取舍，或者一段正在变化的实现。我先把它们丢在这里。</p>
            <div class="updates-sync" role="status" aria-live="polite">
              <i aria-hidden="true"></i>
              <span id="syncStatus">正在翻记录</span>
            </div>
          </div>
        </div>
      </section>

      <section class="updates-workspace" aria-labelledby="feedHeading">
        <div class="updates-toolbar">
          <form class="updates-search" action="./updates.html" method="get" role="search">
            <label for="updatesSearchInput">搜一下</label>
            <div class="updates-search__control">
              <input
                id="updatesSearchInput"
                name="q"
                type="search"
                autocomplete="off"
                maxlength="120"
                placeholder="关键词或标签"
              />
              <button type="submit">搜索</button>
            </div>
            <input id="updatesLabelInput" name="label" type="hidden" disabled />
          </form>

          <div class="updates-filter" id="updatesFilter" hidden>
            <span id="updatesFilterText"></span>
            <a href="./updates.html">清除</a>
          </div>
        </div>

        <div class="updates-results-head">
          <div>
            <p class="section-label" id="feedKicker">From the workbench</p>
            <h2 id="feedHeading">最近更新</h2>
          </div>
          <p id="resultSummary" aria-live="polite">读取中</p>
        </div>

        <div class="updates-content" id="updatesContent" aria-busy="true">
          <div class="updates-skeleton" aria-hidden="true">
            <div><span></span><strong></strong><p></p></div>
            <div><span></span><strong></strong><p></p></div>
            <div><span></span><strong></strong><p></p></div>
            <div><span></span><strong></strong><p></p></div>
          </div>
        </div>

        <noscript>
          <p class="updates-message">
            这个页面暂时没有正常加载。也可以直接去
            <a href="https://github.com/CS-wude/javaweb/issues">GitHub Issues</a>
            翻原始记录。
          </p>
        </noscript>
      </section>
      <nav class="page-route page-route--standalone" data-page-route aria-label="页面间导航"></nav>
    </main>

    <footer class="site-footer updates-footer">
      <div>
        <p class="section-label">Loose ends</p>
        <h2>有结论的写下来，没想明白的也先留着。</h2>
      </div>
      <div class="footer-links">
        <a href="mailto:wudemail@foxmail.com">Email ↗</a>
        <a href="https://github.com/CS-wude" target="_blank" rel="noreferrer">GitHub ↗</a>
      </div>
      <div class="footer-bottom">
        <span>© <span id="currentYear"></span> WUDE</span>
        <a href="#top">Back to top ↑</a>
      </div>
    </footer>

    <script type="module" src="./site.js"></script>
    <script type="module" src="./page-route.js?v=20260821-1"></script>
    <script src="./data/updates-data.js"></script>
    <script src="./updates.js"></script>
  </body>
</html>
